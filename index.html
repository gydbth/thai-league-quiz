<title>ทายนักเตะไทยลีก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap">
<style>
/* Light "clean sports" look: pale blue-grey ground with drafting-grid + dot-matrix decor, white cards with hairline borders,
   cobalt primary, sky-blue "challenge" bubble. Start = title row, hero card (line-art striker + pitch copy), 3 icon tiles,
   your-record ring, CTA. Quiz/summary reuse the same cards. */
:root{
  --bg:#eef3fa;
  --card:#ffffff;
  --line:#dde5f0;
  --grid:#d3dded;
  --ink:#0f1a3a;
  --muted:#5d6b88;
  --dim:#8a96ad;
  --primary:#2b3de8;
  --primary2:#4152ff;
  --sky:#1f8bf3;
  --soft:#e8eeff;
  --gold:#f5b400;
  --good:#12a866;
  --bad:#e5484d;
  --shadow:0 1px 2px rgba(15,26,58,.04),0 10px 30px rgba(31,59,140,.08);
  --font:"Prompt","Noto Sans Thai",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
#app{position:relative;min-height:100%;overflow:hidden}
#app{background:repeating-linear-gradient(180deg,#eef3fa 0 72px,#e9f0f8 72px 144px)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20680%201040%22%20fill%3D%22none%22%20stroke%3D%22%23cdd8ea%22%20stroke-width%3D%223%22%3E%3Crect%20x%3D%2220%22%20y%3D%2220%22%20width%3D%22640%22%20height%3D%221000%22%20rx%3D%226%22/%3E%3Cpath%20d%3D%22M20%20520H660%22/%3E%3Ccircle%20cx%3D%22340%22%20cy%3D%22520%22%20r%3D%2292%22/%3E%3Ccircle%20cx%3D%22340%22%20cy%3D%22520%22%20r%3D%225%22%20fill%3D%22%23cdd8ea%22/%3E%3Crect%20x%3D%22150%22%20y%3D%2220%22%20width%3D%22380%22%20height%3D%22170%22/%3E%3Crect%20x%3D%22250%22%20y%3D%2220%22%20width%3D%22180%22%20height%3D%2262%22/%3E%3Cpath%20d%3D%22M262%20190a92%2092%200%200%200%20156%200%22/%3E%3Ccircle%20cx%3D%22340%22%20cy%3D%22135%22%20r%3D%224%22%20fill%3D%22%23cdd8ea%22/%3E%3Crect%20x%3D%22150%22%20y%3D%22850%22%20width%3D%22380%22%20height%3D%22170%22/%3E%3Crect%20x%3D%22250%22%20y%3D%22958%22%20width%3D%22180%22%20height%3D%2262%22/%3E%3Cpath%20d%3D%22M262%20850a92%2092%200%200%201%20156%200%22/%3E%3Ccircle%20cx%3D%22340%22%20cy%3D%22905%22%20r%3D%224%22%20fill%3D%22%23cdd8ea%22/%3E%3Cpath%20d%3D%22M20%2038a18%2018%200%200%200%2018-18M642%2020a18%2018%200%200%200%2018%2018M20%201002a18%2018%200%200%201%2018%2018M642%201020a18%2018%200%200%201%2018-18%22/%3E%3C/svg%3E") center 0/auto 100% no-repeat;opacity:.9}
.page{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:22px 16px 26px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.ib{appearance:none;border:1px solid var(--line);background:var(--card);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:var(--shadow);color:var(--ink)}
.ib svg{width:18px;height:18px}
.label{font-size:.76rem;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}

/* start */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{margin:2px 0 0;font-size:1.85rem;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.hero{position:relative;display:grid;grid-template-columns:46% 1fr;align-items:center;gap:6px;padding:40px 18px 66px 8px;min-height:250px;border-radius:26px;
  background:linear-gradient(180deg,#fff,#f7f9ff);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero img.fig{display:block;width:100%;height:auto;max-height:230px;object-fit:contain}
.hero h2{margin:0;font-size:1.22rem;line-height:1.3;font-weight:700;text-wrap:balance}
.hero p{margin:8px 0 0;font-size:.86rem;color:var(--muted);line-height:1.55}
.logo{position:absolute;top:16px;right:16px;width:30px;height:30px}
.bubble{position:absolute;right:14px;bottom:-26px;width:88px;height:88px;z-index:2;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 30% 30%,#ff6b6b,#e0262f);color:#fff;font-weight:600;font-size:.88rem;line-height:1.2;box-shadow:0 12px 28px rgba(224,38,47,.38);transition:transform .2s}
.bubble small{display:block;font-size:.66rem;font-weight:400;opacity:.9;margin-top:2px}
.hardtag{display:inline-block;font-size:.68rem;font-weight:600;color:#fff;background:#e0262f;padding:1px 8px;border-radius:999px;margin-right:4px}
.bubble:hover{transform:scale(1.05) rotate(-4deg)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tiles div{padding:14px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.tiles .v{display:flex;align-items:center;gap:7px;font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.tiles .v svg{width:18px;height:18px;color:var(--muted)}
.record{display:flex;align-items:center;gap:16px;padding:16px 18px}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--soft)} .ring .fgc{stroke:var(--primary);stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.9rem;font-weight:600}
.record h3{margin:0;font-size:.98rem;font-weight:600}
.record p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.cta{appearance:none;border:0;cursor:pointer;width:100%;background:linear-gradient(180deg,var(--primary2),var(--primary));color:#fff;font-weight:600;font-size:1.05rem;padding:17px;border-radius:999px;
  box-shadow:0 12px 26px rgba(43,61,232,.32);transition:transform .15s,filter .2s;display:flex;align-items:center;justify-content:center;gap:10px}
.cta:hover{filter:brightness(1.06)} .cta:active{transform:scale(.98)}
.cta:disabled{opacity:.35;box-shadow:none;cursor:default}
.ghost{appearance:none;cursor:pointer;width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:500;padding:14px;border-radius:999px}
.fine{font-size:.7rem;color:var(--dim);text-align:center;margin:0;line-height:1.6}
.fine a{color:inherit}

/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qtop .mid{text-align:center}
.qtop .mid b{display:block;font-weight:600;font-size:.98rem}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:5px;border-radius:3px;background:#d9e1ee}
.prog i.ok{background:var(--good)} .prog i.no{background:var(--bad)} .prog i.now{background:var(--primary)}
.qpanel{position:relative;margin-top:34px;padding:52px 18px 20px;text-align:center;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.timer{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;background:var(--card);padding:5px;box-shadow:var(--shadow);border:1px solid var(--line)}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:4.5}
.timer .bgc{stroke:var(--soft)} .timer .fgc{stroke:var(--primary);stroke-linecap:round}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums}
.timer.low .fgc{stroke:var(--bad)} .timer.low span{color:var(--bad)}
.who{display:flex;align-items:center;gap:12px;text-align:left;padding:10px;border-radius:18px;background:#f4f7fd}
.who img{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none}
.who.big{flex-direction:column;text-align:center;background:none;padding:0}
.who.big img{width:116px;height:116px;border-radius:22px;box-shadow:var(--shadow)}
.who b{display:block;font-weight:600;font-size:1.05rem;line-height:1.25}
.who small{color:var(--muted);font-size:.78rem}
.sep{border:0;border-top:1px dashed var(--line);margin:16px 0}
.qtext{margin:0;font-weight:600;font-size:1.12rem;line-height:1.5;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:13px 16px;font-weight:500;box-shadow:0 1px 2px rgba(15,26,58,.04);transition:border-color .15s,background .2s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--primary);background:#f6f8ff}
.opt:active:not(:disabled){transform:scale(.985)}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt .o{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid #c9d3e3;display:grid;place-items:center}
.opt .o svg{width:14px;height:14px;opacity:0}
.opt:disabled{cursor:default}
.opt.right{background:#e9f8f0;border-color:#8ad9b3;color:#0b7a49}
.opt.right .o{background:var(--good);border-color:var(--good)} .opt.right .o svg{opacity:1}
.opt.wrong{background:#fdeeee;border-color:#f2a3a5;color:#c0262c}
.opt.wrong .o{background:var(--bad);border-color:var(--bad)} .opt.wrong .o svg{opacity:1}
.note{min-height:1.4em;text-align:center;font-weight:500;font-size:.9rem}
.note.good{color:var(--good)} .note.bad{color:var(--bad)}
.spacer{flex:1}

/* summary */
.sum{padding:24px 18px;text-align:center;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px}
.sum .ring{width:168px;height:168px}
.sum .ring .fgc{stroke:var(--gold)}
.sum .ring b{display:flex;flex-direction:column;align-items:center;justify-content:center}
.sum .ring b span{font-size:5rem;font-weight:700;line-height:.9;color:var(--gold);font-variant-numeric:tabular-nums}
.sum .ring b small{display:block;font-size:.78rem;color:var(--muted);font-weight:400;margin-top:6px}
.sum h2{margin:8px 0 0;font-size:1.25rem;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px}
.item img{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none}
.item div{flex:1;min-width:0}
.item b{display:block;font-weight:500;line-height:1.3}
.item small{color:var(--muted);font-size:.76rem}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;background:#d9e1ee}
.pips i.ok{background:var(--good)} .pips i.no{background:var(--bad)}
.item em{font-style:normal;font-weight:600;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right}
.sharebtn{appearance:none;cursor:pointer;width:100%;border:0;border-radius:999px;padding:15px;font-weight:600;font-size:1.02rem;background:var(--sky);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px rgba(31,139,243,.3)}
.sharebtn svg{width:18px;height:18px}
.shot{display:flex;justify-content:center}
.shot img{width:min(100%,320px);aspect-ratio:9/16;border-radius:22px;box-shadow:0 24px 50px rgba(15,26,58,.25);background:#0c0828}
.hintline{text-align:center;font-size:.8rem;color:var(--muted);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{min-height:1.3em;text-align:center;font-size:.85rem;color:var(--good)}

canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:9;width:100%;height:100%}
.enter{animation:enter .45s cubic-bezier(.2,.9,.3,1)}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.shake{animation:shake .35s ease}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-2px)}}
.art .kick{transform-box:view-box;transform-origin:90px 108px;animation:kick 2.8s cubic-bezier(.55,0,.25,1) infinite}
@keyframes kick{0%,45%{transform:rotate(8deg)}60%{transform:rotate(-58deg)}72%{transform:rotate(-52deg)}100%{transform:rotate(8deg)}}
.art .shot{animation:shot 2.8s ease-out infinite}
@keyframes shot{0%,58%{transform:none;opacity:1}78%{transform:translate(34px,-10px);opacity:0}79%{transform:translate(-10px,0);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function pool(p){
  const out=[], played=p.clubs.map(c=>c.c);
  if(p.place) out.push(p.abroad?mk("เขาเกิดที่ประเทศใด?",p.place,pick(COUNTRIES,[p.place],3)):mk("เขาเกิดที่จังหวัดใด?",p.place,pick(PROVINCES,[p.place],3)));
  if(p.born) out.push(mk("เขาเกิดปี ค.ศ. ใด?",p.born,near(p.born,[-3,-2,-1,1,2,3])));
  if(p.h) out.push(mk("ส่วนสูงของเขาตามข้อมูลทางการคือ?",p.h+" ซม.",near(p.h,[-8,-5,-3,3,5,8]).map(v=>v+" ซม.")));
  if(p.youth) out.push(mk("เขาเติบโตมาจากทีมเยาวชน/โรงเรียนใด?",p.youth,pick(YOUTHS,[p.youth],3)));
  const senior=p.clubs.filter(c=>!c.loan);
  if(senior.length>=2) out.push(mk("สโมสรอาชีพทีมแรกในชีวิตค้าแข้งของเขาคือ?",senior[0].c,pick(played.filter(c=>c!==senior[0].c).concat(dis(senior[0].c,[])),[senior[0].c],3)));
  if(played.length>=3) {const never=pick(THAICLUBS,played,1)[0]; out.push(mk("สโมสรใดที่เขา \"ไม่เคย\" เล่นให้?",never,shuffle(played).slice(0,3)));}
  if(played.length) {const c=shuffle(played)[0]; out.push(mk("สโมสรใดที่เขาเคยเล่นให้?",c,dis(c,played)));}
  const loans=p.clubs.filter(c=>c.loan);
  if(loans.length) {const l=shuffle(loans)[0]; out.push(mk("เขาเคยถูกยืมตัวไปเล่นให้ทีมใด?",l.c,dis(l.c,played)));}
  const moves=senior.slice(1).filter(c=>c.y && senior.filter(s=>s.c===c.c)[0]===c);
  if(moves.length) {const m=shuffle(moves)[0]; out.push(mk(`เขาย้ายไปร่วม ${m.c} ครั้งแรกในปีใด?`,m.y,near(m.y,[-3,-2,-1,1,2,3])));}
  if(p.cur) out.push(mk("ปัจจุบัน (ต.ค. 2026) เขาสังกัดทีมใด?",p.cur,dis(p.cur,[])));
  if(p.caps!=null){const a=capsBand(p.caps);const all=["น้อยกว่า 10 นัด","10–19 นัด","20–29 นัด","30–39 นัด","40–49 นัด","50–59 นัด","60–69 นัด","70–79 นัด","80–89 นัด","90–99 นัด","100 นัดขึ้นไป"];
    const i=all.indexOf(a);const nb=all.filter((x,j)=>x!==a&&Math.abs(j-i)<=3);out.push(mk("เขาลงเล่นให้ทีมชาติไทยชุดใหญ่กี่นัด?",a,shuffle(nb).slice(0,3)));}
  if(p.goals!=null){const a=goalBand(p.goals);out.push(mk("เขายิงให้ทีมชาติไทยชุดใหญ่ไปกี่ประตู?",a,pick(["ยังไม่เคยยิง","1–4 ประตู","5–9 ประตู","10–19 ประตู","20–39 ประตู","40 ประตูขึ้นไป"],[a],3)));}
  (EXTRA[p.id]||[]).forEach(f=>out.push(mk(f.q,f.a,f.d)));
  return out;
}
function buildQuiz(p){
  const who={q:"นักเตะในรูปคือใคร?",a:p.name,opts:shuffle([p.name,...pick(PLAYERS.filter(x=>x.pos===p.pos||Math.abs(x.born-p.born)<4).map(x=>x.name).concat(PLAYERS.map(x=>x.name)),[p.name],3)]),who:true};
  const ps=pool(p).filter(q=>new Set(q.opts).size===4);
  // ไม่เอาคำถามประเภทเดียวกันซ้ำ
  // สุ่มคำถาม ไม่ซ้ำ และเรื่องสโมสรไม่เกิน 2 ข้อ
  const seen=new Set(),rest=[];let clubQ=0;
  for(const q of shuffle(ps)){ if(seen.has(q.q))continue; const isClub=/สโมสร|ยืมตัว|ย้ายไป|สังกัด/.test(q.q);
    if(isClub&&clubQ>=2)continue; if(isClub)clubQ++; seen.add(q.q); rest.push(q)}
  return [who,...rest.slice(0,QN-1)];
}

function beep(seq,type="triangle"){ if(!sound)return; try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  let t=ac.currentTime; for(const [f,d] of seq){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);t+=d*.8}}catch(e){} }

/* ---------- game ---------- */
function newGame(h){ if(h!==undefined){HARD=h;TIME=h?5:8} lineup=shuffle(PLAYERS).slice(0,PER); pi=0; results=[]; nextPlayer(); }
function nextPlayer(){ player=lineup[pi]; quiz=buildQuiz(player); idx=0; marks=[]; ask(); }
const pad=n=>String(n).padStart(2,"0");

function ask(){
  const q=quiz[idx], hidden=idx===0, n=pi*QN+idx+1; locked=false;
  const prog=Array.from({length:PER*QN},(_,i)=>{const p=Math.floor(i/QN),j=i%QN;const m=p<pi?results[p].marks[j]:p===pi?marks[j]:undefined;return `<i class="${m===true?"ok":m===false?"no":i===n-1?"now":""}"></i>`}).join("");
  app.innerHTML=`<div class="page">
    <div class="qtop"><button class="ib" id="home" type="button" aria-label="กลับหน้าแรก">${ICON.back}</button>
      <div class="mid"><span class="label">${HARD?'<span class="hardtag">โหมดท้าทาย</span>':""}นักเตะ ${pi+1} จาก ${PER}</span><b>คำถาม ${pad(n)}/${PER*QN}</b></div>${sndBtn()}</div>
    <div class="prog">${prog}</div>
    <section class="qpanel enter">
      <div class="timer" id="timer"><svg viewBox="0 0 58 58"><circle class="bgc" cx="29" cy="29" r="25"/><circle class="fgc" id="arc" cx="29" cy="29" r="25" stroke-dasharray="157.1" stroke-dashoffset="0"/></svg><span id="sec">${TIME}</span></div>
      <div class="who ${hidden?"big":""}"><img src="${IMG[player.id]}" alt="${hidden?"นักเตะปริศนา":esc(player.name)}">
        <div><b id="pname">${hidden?"นักเตะปริศนา":esc(player.name)}</b><small>${hidden?"ดูรูปแล้วทายชื่อ":esc(ABBR[player.pos]+" · "+player.pos)}</small></div></div>
      <hr class="sep">
      <p class="qtext">${esc(q.q)}</p>
    </section>
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt" id="o${i}" type="button" data-v="${esc(o)}"><span class="t">${esc(o)}</span><span class="o">${ICON.check}</span></button>`).join("")}</div>
    <div class="note" id="note"></div>
    <div class="spacer"></div>
    <button class="cta" id="next" type="button" disabled>${idx<QN-1?"ข้อต่อไป":pi<PER-1?"นักเตะคนต่อไป":"ดูผลรวม"}</button>
  </div>`;
  $("#home").onclick=startScreen; bindSnd();
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b));
  $("#next").onclick=go;
  startTimer();
}

function startTimer(){
  cancelAnimationFrame(timer); t0=performance.now(); let last=TIME;
  const tick=now=>{ if(locked)return; const left=Math.max(0,TIME-(now-t0)/1000), s=Math.ceil(left), arc=$("#arc"); if(!arc)return;
    arc.style.strokeDashoffset=157.1*(1-left/TIME); $("#timer").classList.toggle("low",left<=3);
    if(s!==last){$("#sec").textContent=s; if(s<=3&&s>0)sTick(); last=s}
    if(left<=0) return answer(null);
    timer=requestAnimationFrame(tick)};
  timer=requestAnimationFrame(tick);
}

function answer(btn){
  if(locked)return; locked=true; cancelAnimationFrame(timer);
  const q=quiz[idx], ok=!!btn&&btn.dataset.v===q.a; marks[idx]=ok;
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true; if(b.dataset.v===q.a)b.classList.add("right")});
  if(btn&&!ok){btn.classList.add("wrong","shake");btn.querySelector(".o").innerHTML=ICON.x}
  ok?sGood():sBad();
  if(q.who){$("#pname").textContent=player.name; $("#pname").nextElementSibling.textContent=ABBR[player.pos]+" · "+player.pos}
  const cur=document.querySelectorAll(".prog i")[pi*QN+idx]; if(cur)cur.className=ok?"ok":"no";
  const n=$("#note"); n.className="note "+(ok?"good":"bad");
  n.textContent=ok?"ถูกต้อง":(btn?`คำตอบที่ถูกคือ ${q.a}`:`หมดเวลา · คำตอบคือ ${q.a}`);
  const nx=$("#next"); nx.disabled=false; nx.focus();
}

function go(){
  if(idx<QN-1){idx++;ask();return}
  results.push({p:player,marks:[...marks],right:marks.filter(Boolean).length}); pi++;
  pi<PER?nextPlayer():finishGame();
}

let final=null;
function finishGame(){
  const right=results.reduce((s,r)=>s+r.right,0), total=PER*QN, pct=right/total;
  stats.games++; const bk=HARD?"bestHard":"best"; const isBest=right>(stats[bk]||0); if(isBest)stats[bk]=right; save();
  const msg=pct===1?"เทพเจ้าบอลไทย":pct>=.8?"เซียนไทยลีกตัวจริง":pct>=.6?"แฟนพันธุ์แท้ขอบสนาม":pct>=.4?"ขาเชียร์มือสมัครเล่น":"มือใหม่หัดเชียร์";
  final={right,total,pct,isBest,msg,best:stats[bk],hard:HARD}; summary(true);
}
function summary(celebrate){
  const {right,total,pct,isBest,msg,best,hard}=final;
  app.innerHTML=`<div class="page">
    <div class="qtop"><button class="ib" id="home" type="button" aria-label="กลับหน้าแรก">${ICON.back}</button><div class="mid"><span class="label">${hard?'<span class="hardtag">โหมดท้าทาย</span>':""}จบเกม</span><b>สรุปผล</b></div>${sndBtn()}</div>
    <section class="sum enter" id="sum">${ring(0,120,`<span id="fin">0</span><small>จาก ${total} ข้อ</small>`)}
      <h2>${msg}</h2><span class="label">${isBest?"สถิติใหม่ของคุณ":`สถิติดีที่สุด${hard?"โหมดท้าทาย":""} ${best}/${total}`}</span></section>
    <div class="list">${results.map(r=>`<div class="panel item"><img src="${IMG[r.p.id]}" alt=""><div><b>${esc(r.p.name)}</b><small>${esc(ABBR[r.p.pos]||"")} · ${esc(r.p.cur||"–")}</small></div>
      <span class="pips">${r.marks.map(m=>`<i class="${m?"ok":"no"}"></i>`).join("")}</span><em>${r.right}/${QN}</em></div>`).join("")}</div>
    <button class="sharebtn" id="share" type="button">${ICON.share}แชร์ผลลัพธ์</button>
    <button class="cta" id="again" type="button">${ICON.play}เล่นอีกรอบ</button>
    <button class="ghost" id="back" type="button">หน้าแรก</button>
    <p class="fine">เครดิตรูป: ${results.map(r=>`<a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(r.p.file)}" target="_blank" rel="noopener">${esc(r.p.name)} – ${esc(r.p.credit)}</a>`).join(" · ")}</p>
  </div>`;
  $("#home").onclick=startScreen; $("#back").onclick=startScreen; $("#again").onclick=()=>{sGo();newGame()}; bindSnd();
  $("#share").onclick=()=>shareScreen({right,total,msg});
  const arc=document.querySelector("#sum .fgc"), C=2*Math.PI*52, t=performance.now();
  arc.style.strokeDashoffset=C;
  const f=now=>{const p=Math.min(1,(now-t)/1100),e=1-Math.pow(1-p,3);arc.style.strokeDashoffset=C*(1-pct*e);$("#fin").textContent=Math.round(right*e);
    if(p<1)requestAnimationFrame(f);else if(celebrate&&pct>=.6){sWin();burst(pct>=.8?140:70)}};
  requestAnimationFrame(f);
}

/* ---------- share ---------- */
let lastShare=null;
function shareText(r){
  const grid=results.map(x=>x.marks.map(m=>m?"🟩":"🟥").join("")).join("\n");
  return `ทายนักเตะไทยลีก ⚽\nได้ ${r.right}/${r.total} — ${r.msg}\n\n${grid}\n\nมาลองแข่งกันดู!`;
}
function shareScreen(r){
  lastShare=r;
  app.innerHTML=`<div class="page">
    <div class="qtop"><button class="ib" id="bk" type="button" aria-label="กลับไปหน้าสรุปผล">${ICON.back}</button><div class="mid"><span class="label">อวดเพื่อน</span><b>แชร์ผลลัพธ์</b></div><span style="width:40px"></span></div>
    <div class="shot enter"><img id="card" alt="การ์ดผลคะแนน ${r.right} จาก ${r.total}"></div>
    <p class="hintline">บนมือถือ กดค้างที่รูปเพื่อบันทึกหรือแชร์ได้เลย</p>
    <div class="row2"><button class="sharebtn" id="save" type="button">${ICON.down}บันทึกรูป</button><button class="ghost" id="copy" type="button">คัดลอกข้อความ</button></div>
    <div class="toast" id="toast" role="status"></div>
    <button class="cta" id="again" type="button">${ICON.play}เล่นอีกรอบ</button>
  </div>`;
  $("#bk").onclick=()=>summary(false); $("#again").onclick=()=>{sGo();newGame()};
  const toast=t=>{$("#toast").textContent=t};
  let blob=null;
  drawCard(r).then(c=>{ $("#card").src=c.toDataURL("image/png"); c.toBlob(b=>blob=b,"image/png"); });
  $("#copy").onclick=()=>{const t=shareText(r);
    navigator.clipboard?.writeText(t).then(()=>toast("คัดลอกแล้ว วางในแชตได้เลย"),()=>toast(t))??toast(t)};
  const fname=`thai-league-quiz-${r.right}of${r.total}.png`;
  if(STANDALONE){
    $("#save").onclick=async()=>{ if(!blob)return;
      const file=new File([blob],fname,{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){ try{await navigator.share({files:[file],title:"ทายนักเตะไทยลีก",text:shareText(r)});return}catch(e){ if(e.name==="AbortError")return } }
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();toast("บันทึกรูปแล้ว");
    };
    $("#save").lastChild.textContent=navigator.canShare?"แชร์รูป":"บันทึกรูป";
    return;
  }
  (window.claude?.use?window.claude.use("downloads"):Promise.resolve(null)).then(dl=>{
    if(!dl){$("#save").hidden=true;return}
    $("#save").onclick=async()=>{ if(!blob)return; try{await dl.save({filename:fname,data:blob});toast("บันทึกรูปแล้ว")}
      catch(e){ if(e?.code==="declined")return; toast("บันทึกไม่ได้ในหน้านี้ ลองกดค้างที่รูปแทน") } };
  }).catch(()=>{$("#save").hidden=true});
}
const loadImg=src=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src});
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
async function drawCard(r){
  try{await Promise.all(['800 100px Prompt','700 60px Prompt','600 40px Prompt','400 30px Prompt'].map(f=>document.fonts.load(f)))}catch(e){}
  const W=1080,H=1920,cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
  const F=(w,s)=>`${w} ${s}px Prompt, "Noto Sans Thai", sans-serif`;
  // background: deep indigo + soft colour orbs
  c.fillStyle="#0c0828";c.fillRect(0,0,W,H);
  const orb=(x,y,rad,col)=>{const g=c.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");c.fillStyle=g;c.fillRect(0,0,W,H)};

/* ---------- confetti ---------- */
const fx=$("#fx"),cx=fx.getContext("2d");let parts=[],raf;
function burst(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const dpr=devicePixelRatio||1;fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#2b3de8","#1f8bf3","#12a866","#f5b400","#e5484d"];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.28,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cols[i%5],life:0});
  cancelAnimationFrame(raf);const step=()=>{cx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.life<120&&p.y<innerHeight+20);
    for(const p of parts){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life++;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()}
    if(parts.length)raf=requestAnimationFrame(step)};step();
}
